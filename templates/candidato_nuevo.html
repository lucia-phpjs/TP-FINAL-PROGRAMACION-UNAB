{% extends "base.html" %}

{% block contenido %}

<section class="contenedor">

    <h1>Registrar candidato</h1>

    <form id="formCandidato">

        <label>Nombre</label>
        <input type="text" id="nombre" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Teléfono</label>
        <input type="text" id="telefono">

        <label>Años de experiencia</label>
        <input type="number" id="anosExperiencia">

        <label>CV</label>
        <textarea id="cv"></textarea>

        <label>Habilidades (separadas por coma)</label>
        <input type="text" id="habilidades">

        <button type="submit">
            Guardar candidato
        </button>

    </form>

</section>

<script>

document
.getElementById("formCandidato")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const candidato = {

        nombre: document.getElementById("nombre").value,

        email: document.getElementById("email").value,

        telefono: document.getElementById("telefono").value,

        anos_experiencia: parseInt(
            document.getElementById("anosExperiencia").value || 0
        ),

        cv: document.getElementById("cv").value,

        habilidades: document
            .getElementById("habilidades")
            .value
            .split(",")
            .map(h => h.trim())
            .filter(h => h !== "")
    };

    const response = await fetch("/api/candidatos", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(candidato)

    });

    const resultado = await response.json();

    if(response.ok){

        alert(resultado.mensaje);

        window.location.href = "/candidatos";

    } else {

        alert(resultado.error);

    }

});

</script>

{% endblock %}
